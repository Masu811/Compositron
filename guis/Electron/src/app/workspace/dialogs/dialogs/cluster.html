<dialog [open]="appData.dialogOpen()">
  <div class="frame">
    <h1>MeasurementCampaign.cluster</h1>
  </div>
  <form [formGroup]="formModel" (submit)="submit($event)">
    <h3>Parameters to Cluster</h3>
    <div formArrayName="params">
      @for (item of params.controls; track $index; let i = $index) {
        <div [formGroupName]="i">
          <label>Parameter {{i+1}}:</label>
          <input type="text" formControlName="param"/>
          <label>Target:</label>
          <select formControlName="target">
            <option>auto</option>
            <option>DopplerMeasurement</option>
            <option>SingleSpectrum</option>
            <option>CoincidenceSpectrum</option>
          </select>
          <label>Parser:</label>
          <input type="text" [value]="item.value.parser.repr" (click)="openParserDialog(0)" readonly>
        </div>
      }
    </div>
    @if (params.controls.length < 10) {
      <button type="button" (click)="addParam()">+</button>
    }
    <h3>Cluster Determination</h3>
    <div>
      <label>Specify Clusters By</label>
      <select formControlName="method">
        <option value="n_clusters">Number of Clusters</option>
        <option value="clusters">Value of Clusters</option>
        <option value="guess">Guess of Clusters</option>
      </select>
    </div>
    @if (method.value == "n_clusters") {
      <div>
        <input type="number" formControlName="n_clusters">
      </div>
    } @else {
      <div formArrayName="clusters">
        @for (cluster of clusters.controls; track $index; let i = $index) {
          <div>
            <label>Parameter {{i+1}} Values:</label>
            <input type="text" [formControlName]="i"/>
          </div>
        }
      </div>
    }
    <div class="frame">
      <button type="submit">Compute</button>
      <button type="button" (click)="close()">Cancel</button>
    </div>
  </form>
</dialog>
