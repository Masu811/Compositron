<dialog [open]="appData.dialogOpen()">
  <div class="frame">
    <h1>MeasurementCampaign.ratio_plotter</h1>
  </div>
  <form (submit)="submit($event)" [formGroup]="formModel">
    <div>
      <label>Reference:</label>
      <input type="text" formControlName="reference">
      <label>Comparands:</label>
      <input type="text" formControlName="comparands">
    </div>
    <div>
      <label>Mirrored:</label>
      <input type="checkbox" formControlName="mirrored">
      <label>Normalize Eres:</label>
      <input type="checkbox" formControlName="normalize_eres">
      <!--<label>X Axis:</label>
      <select formControlName="x_axis">
        <option value="de">Energy - 511 keV</option>
        <option value="e">Energy</option>
        <option value="m0c">Momentum</option>
      </select>-->
    </div>
    <div>
      <label>Bins:</label>
      <input type="number" formControlName="bins">
      <label>ROI Width:</label>
      <input type="number" formControlName="roi_width">
      <label>Background Subtraction:</label>
      <input type="checkbox" formControlName="bg_sub">
    </div>
    <div class="frame">
      <button type="submit">Compute</button>
      <button type="button" (click)="close()">Cancel</button>
    </div>
  </form>
</dialog>
